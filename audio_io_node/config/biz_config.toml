[logging]
directory = "/userdata/log/audio_io_node"
level = "info"
pattern = "%Y-%m-%d %H:%M:%S.%e [%^%l%$] [%n] %v"
console = true
max_file_size_mb = 20
max_files_per_day = 3
retention_days = 7

[audio_io]
capture_device = "hw:0,0"
playback_device = "xiaocai_speaker"
wake_ack_path = "/home/lckfb/xiaocai_robot/resource/speech/wake_ack.wav"
startup_music_path = "audio/boot_music.wav"
volume_percent = 80
adc_pga_gain = 9
mic_boost_gain = 1

[audio_io.alsa]
pcm_name = "xiaocai_speaker"
slave_pcm = "plug:dmix"
softvol_control_name = "Xiaocai Output Gain"
card = 0
min_db = -60.0
max_db = 6.0
resolution = 256
