[logging]
directory = "/userdata/log/music_node"
level = "info"
pattern = "%Y-%m-%d %H:%M:%S.%e [%^%l%$] [%n] %v"
console = true
max_file_size_mb = 20
max_files_per_day = 3
retention_days = 7

[music]
cli_path = "/usr/local/bin/ncm-cli"
default_keyword = "轻音乐"
# ncm-cli decoder control socket. Empty uses ~/.config/ncm-cli/mpv.sock.
mpv_socket = ""
# The decoder writes raw PCM here; audio_io_node alone opens the sound card.
pcm_fifo = "/tmp/xiaocai_music_node.pcm"
sample_rate = 48000
channels = 2
wake_ack_path = "/home/lckfb/xiaocai_robot/resource/speech/wake_ack.wav"
