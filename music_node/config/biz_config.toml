[logging]
directory = "/userdata/log/music_node"
level = "info"
pattern = "%Y-%m-%d %H:%M:%S.%e [%^%l%$] [%n] %v"
console = true
max_file_size_mb = 20
max_files_per_day = 3
retention_days = 7

[music]
cli_path = "/usr/local/bin/ncm-cli"
# Leave empty to use ~/.config/ncm-cli/mpv.sock.
mpv_socket = ""
default_keyword = "轻音乐"
audio_device = "alsa/xiaocai_speaker"
wake_ack_path = "/home/lckfb/xiaocai_robot/resource/speech/wake_ack.wav"
