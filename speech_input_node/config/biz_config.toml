[logging]
directory = "/userdata/log/speech_input_node"
level = "info"
pattern = "%Y-%m-%d %H:%M:%S.%e [%^%l%$] [%n] %v"
console = true
max_file_size_mb = 20
max_files_per_day = 3
retention_days = 7

[speech_input]
wake_model_path = "/home/lckfb/xiaocai_robot/resource/speech/vosk-model-small-cn-0.22"
